<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        font-size: 12px;
        color: #1a1a1a;
      }
      button {
        width: 100%;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #18a0fb;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #0d8de0;
      }
      #status {
        margin-top: 12px;
        min-height: 16px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <button id="export">Export to GDD</button>
    <p id="status">Reads local Figma variables and POSTs them to the GDD receiver on localhost:5179.</p>
    <script>
      document.getElementById('export').onclick = function () {
        document.getElementById('status').textContent = 'Exporting…';
        parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
      };
    </script>
  </body>
</html>
