# Gitleaks config for hone — D-12
# Extends the default v8 rule set with allowlist overrides for planning dirs,
# dev-only paths, and documentation-example tokens.

title = "hone gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known safe paths and placeholder patterns"
# NOTE: the planning/agent dirs (.planning/, .claude/, .design/) are deliberately
# NOT blanket-allowlisted here. Secrets leaked into those exact dirs in pushed
# commits twice historically (S3); a directory-wide allowlist would make a real
# secret there invisible to gitleaks. Tracked files under them are scanned
# normally. Only narrow, justified file/path entries are allowlisted below.
paths = [
  '''test/fixtures/baselines/''',
  '''node_modules/''',
  # test/suite/redact.test.cjs contains intentional fake JWTs + PEM blocks
  # used to exercise the Phase 22 secret-scrubber regex registry. The
  # whole point of those test fixtures is for gitleaks-style detectors
  # to flag them in source — but the redact module is what consumes
  # them at runtime, not the leaked-credential surface.
  '''test/suite/redact\.test\.cjs''',
  # reference/pseudonymization-rules.md is Phase 30's human-readable
  # documentation of the pseudonymizer's behavior. It includes
  # before/after examples that look like secrets to gitleaks (e.g.
  # `GITHUB_TOKEN=ghp_abc...`) because the document's PURPOSE is to
  # show what the module recognizes + scrubs. The examples are
  # deliberately illustrative, not real credentials.
  '''reference/pseudonymization-rules\.md''',
  # test/suite/pseudonymize.test.cjs + test/suite/issue-reporter-payload.test.cjs
  # exercise the same surface with realistic example tokens for the
  # negative-presence assertions (Phase 30 D-04 redact-before-pseudo
  # order test uses an Anthropic-shaped key as the adversarial input).
  '''test/suite/pseudonymize\.test\.cjs''',
  '''test/suite/issue-reporter-payload\.test\.cjs''',
  # Phase 31 (figma-extract) token-isolation tests. These three files flow
  # synthetic `figd_`-shaped sentinels (figd_x, figd_SENTINEL_DO_NOT_LEAK_31_09,
  # figd_SECRET_*) through pull/styles/health to assert the token is NEVER
  # persisted or logged (D-10). The fake tokens existing in source IS the test;
  # path-allowlisting them is the same pattern used for redact.test.cjs +
  # pseudonymize.test.cjs above. (The regexes block below also covers the
  # synthetic shapes, but the gitleaks pull_request range-scan applies path
  # allowlists most reliably — this is the authoritative suppression.)
  '''test/suite/figma-extract-pull\.test\.cjs''',
  '''test/suite/figma-extract-styles\.test\.cjs''',
  '''test/suite/figma-extract-health\.test\.cjs''',
  # Phase 56 (risk scorer) — exercises the SECRET_SHAPED_RE detector in
  # scripts/lib/risk/tables.cjs by flowing AKIA-shaped + PEM + sk- sentinels
  # (e.g. `AKIA1234567890ABCDEF`) through computeRisk and asserting the
  # secret-shaped input raises the score. The fake tokens existing in source
  # IS the test — same pattern as redact.test.cjs + figma-extract-*.test.cjs.
  '''test/suite/phase-56-risk\.test\.cjs''',
]
regexes = [
  # Placeholder tokens used in reference docs and examples
  '''sk-example-[A-Za-z0-9]+''',
  '''sk-test-[A-Za-z0-9]+''',
  '''ghp_example[A-Za-z0-9]*''',
  # Shields.io / badge URLs (never real secrets)
  '''https://img\.shields\.io/.*''',
  # Phase 31 (figma-extract) — synthetic Figma-PAT sentinels used by the
  # token-isolation tests (test/suite/figma-extract-{pull,styles,health}.test.cjs).
  # Their whole PURPOSE is to flow a fake `figd_`-shaped token through pull/
  # styles/health and assert it is NEVER written to disk or logged (D-10).
  # Real Figma PATs are figd_ + a long base64-ish body; these synthetic forms
  # are either `figd_x` or SCREAMING_SNAKE with SENTINEL/SECRET/DO_NOT_LEAK —
  # shapes a genuine credential never takes.
  '''figd_(x|[A-Za-z0-9_]*(SENTINEL|SECRET|DO_NOT_LEAK)[A-Za-z0-9_]*)''',
]
