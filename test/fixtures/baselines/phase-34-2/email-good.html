<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- EM-DARK-01: color-scheme signal via meta, decoupled from any <style> -->
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Welcome to Acme</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <![endif]-->
  <!-- Tolerated per EM-STYLE-04: a small @media-only responsive/dark block, NOT the primary styling mechanism -->
  <style>
    @media (max-width: 600px) {
      .container { width: 100% !important; }
    }
    @media (prefers-color-scheme: dark) {
      .body-bg { background-color: #111111 !important; }
    }
  </style>
</head>
<body class="body-bg" style="margin:0;padding:0;background-color:#f4f4f4;color-scheme:light dark;">
  <!-- EM-MSO-01: ghost table for Outlook -->
  <!--[if mso]><table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
  <table role="presentation" class="container" width="600" align="center" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;margin:0 auto;background-color:#ffffff;">
    <tr>
      <td style="padding:24px;font-family:Arial,sans-serif;font-size:16px;line-height:24px;color:#111111;background-color:#ffffff;">
        <h1 style="margin:0 0 16px;font-size:24px;color:#111111;">Welcome aboard</h1>
        <p style="margin:0 0 16px;">Thanks for signing up. This message renders the same across clients.</p>
        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td style="border-radius:4px;background-color:#3B82F6;">
              <a href="https://example.com" style="display:block;padding:12px 24px;font-family:Arial,sans-serif;font-size:16px;color:#ffffff;text-decoration:none;">Get started</a>
            </td>
          </tr>
        </table>
        <img src="https://example.com/logo.png" width="120" height="40" alt="Acme logo" style="display:block;margin-top:24px;">
      </td>
    </tr>
  </table>
  <!--[if mso]></td></tr></table><![endif]-->
</body>
</html>
