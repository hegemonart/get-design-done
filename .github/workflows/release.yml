name: Release

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.25.0). Use when push-diff detection failed (HEAD^ vs last-tag mismatch from interleaved commits).'
        required: true
        type: string

# Per D-19: workflow only tags + releases. It does not push to main, force-push, or delete refs.
# Per D-22: release-time smoke test is a separate workflow/job — this workflow ends at release creation.

permissions:
  contents: write   # needed to create tags + releases
  id-token: write   # needed for npm provenance

jobs:
  detect-version:
    name: "Detect version bump"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.diff.outputs.version }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full history for last-tag lookup
          fetch-tags: true

      - name: Resolve version (workflow_dispatch input OR last-tag diff)
        id: diff
        run: |
          set -euo pipefail
          NEW=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json","utf8")).version)')
          # workflow_dispatch: version comes from manual input — skip auto-detection
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            if [ "$INPUT_VERSION" != "$NEW" ]; then
              echo "ERROR: workflow_dispatch input version ($INPUT_VERSION) does not match plugin.json version ($NEW). Refusing to release a mismatched version."
              exit 1
            fi
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: $NEW"
            exit 0
          fi
          # push trigger: compare current plugin.json to last release tag's plugin.json (robust against interleaved commits)
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1 || echo "")
          if [ -z "$LAST_TAG" ]; then
            OLD=""
          else
            OLD=$(git show "$LAST_TAG:.claude-plugin/plugin.json" 2>/dev/null | node -e 'let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>{try{console.log(JSON.parse(d).version)}catch{console.log("")}})' || echo "")
          fi
          echo "last_tag=$LAST_TAG"
          echo "old=$OLD"
          echo "new=$NEW"
          if [ "$OLD" != "$NEW" ] && [ -n "$NEW" ]; then
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version bump detected: $OLD -> $NEW"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version change vs $LAST_TAG. Exiting quietly."
          fi

  tag-and-release:
    name: "Tag + GitHub Release"
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect-version.outputs.version }}"
          BODY=$(node scripts/extract-changelog-section.cjs "$VERSION")
          {
            echo "body<<GDDEOF"
            echo "$BODY"
            echo "GDDEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag (idempotent — skip if already exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect-version.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Backfill path: if a prior failed run already created the tag
          # remotely (e.g. release stopped at smoke-test or npm publish
          # before publishing to the registry), skip re-creation. Downstream
          # jobs (smoke-test, npm publish) operate on the existing tag.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — skipping creation (backfill path)."
          else
            # Create and push the tag pointing at the merge commit on main.
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Check if GitHub Release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect-version.outputs.version }}"
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} already exists — skipping creation (backfill path)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: v${{ needs.detect-version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-smoke-test:
    name: "Release smoke test (fresh checkout + baseline diff)"
    needs: [detect-version, tag-and-release]
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the freshly-created tag
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.detect-version.outputs.version }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run release smoke test against current baseline
        run: |
          set -euo pipefail
          node scripts/release-smoke-test.cjs --baseline test/fixtures/baselines/current

      - name: Rollback guidance on failure
        if: failure()
        run: |
          echo ""
          echo "SMOKE TEST FAILED."
          echo "The tag v${{ needs.detect-version.outputs.version }} has been created but the pipeline diff vs baseline did not match."
          echo "To roll back: run locally as repo admin:"
          echo "  bash scripts/rollback-release.sh ${{ needs.detect-version.outputs.version }}"
          echo "Per D-22, automated rollback is intentionally NOT implemented."
          exit 1

  npm-publish:
    name: "npm publish (@hegemonart/get-design-done)"
    needs: [detect-version, release-smoke-test]
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the freshly-created tag
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.detect-version.outputs.version }}

      - name: Setup Node.js 24
        # Node 24 ships npm 11.x natively, which supports OIDC trusted
        # publishing without an upgrade step. Switching here from Node 22:
        #
        # PRIOR APPROACH (broken on 2026-05-21): use Node 22 + `npm install
        # -g npm@latest`. The runner's bundled npm 10.x on Node 22.22.2 had
        # a corrupted @npmcli/arborist dep tree (missing `promise-retry`),
        # so the `npm install` command itself crashed before it could even
        # download npm@latest:
        #   npm error code MODULE_NOT_FOUND
        #   npm error Cannot find module 'promise-retry'
        #   npm error - /opt/hostedtoolcache/node/22.22.2/x64/lib/node_modules/
        #              npm/node_modules/@npmcli/arborist/lib/arborist/rebuild.js
        # Reproducible across two runs (initial v1.30.5 push + dispatch retry).
        #
        # Node 24 sidesteps the broken cache entirely by shipping a fresh
        # npm 11.x as part of its install. No upgrade step required, so no
        # surface area for the bundled tool cache to corrupt.
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Print npm/node versions (debug)
        run: |
          node --version
          npm --version

      - name: Verify version sync across manifests
        run: node scripts/verify-version-sync.cjs

      - name: Install dependencies (devDeps required for the prepack SDK compile)
        # Phase 31.5 (31-5-9.5) added a `prepack` step that runs `npm run build:sdk`
        # → `node scripts/build-sdk-bins.cjs`, which `require('esbuild')` (a devDep)
        # to compile the SDK TS bins to runnable .js before packing. `npm publish`
        # fires prepack, so esbuild must be present on the runner — install it here.
        # (Pre-31.5 there was no prepack, so publish needed no node_modules; now it does.)
        run: npm ci --no-audit --no-fund

      - name: Publish to npm (with provenance)
        # Auth: npm Trusted Publishing via OIDC, configured at
        # https://www.npmjs.com/package/@hegemonart/get-design-done/access (2026-05-20).
        # The `id-token: write` permission at the workflow level (line 23) is what
        # signs the OIDC token; no long-lived NPM_TOKEN secret is required.
        # Requires npm >= 11.5.1 on the runner — see prior upgrade step.
        # Background: npm rotated all granular tokens after the "Mini Shai-Hulud"
        # supply-chain incident (2026-05-19), invalidating our prior NPM_TOKEN.
        run: npm publish --provenance --access public

  build-tier2-bundles:
    name: "Build Tier-2 distribution bundles (cursor-marketplace + codex-plugin)"
    needs: [detect-version, release-smoke-test]
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the freshly-created tag
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.detect-version.outputs.version }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build all Tier-2 bundles (cursor-marketplace, codex-plugin, agentskills-io)
        # Phase 28.8 (Plan 28-8-X1): scripts/build-distribution-bundles.cjs fans
        # canonical skills/ into dist/cursor-marketplace/, dist/codex-plugin/, and
        # dist/agentskills-io/ via per-channel converters. Running without
        # --channel emits ALL channels deterministically (same input -> same
        # bytes on consecutive runs). The release workflow needs all three so
        # the cursor-marketplace + codex-plugin webhooks (wired in
        # marketplace-publish below) have artifacts to upload.
        run: npm run build:bundles

      - name: Upload Tier-2 bundles as workflow artifact
        # Persist dist/ as a build artifact so marketplace-publish (or a manual
        # download) can consume the deterministic output without rebuilding.
        uses: actions/upload-artifact@v7
        with:
          name: tier2-bundles-v${{ needs.detect-version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  marketplace-publish:
    name: "Marketplace publish (placeholder)"
    needs: [detect-version, release-smoke-test, npm-publish, build-tier2-bundles]
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder — D-23
        run: echo "no-op — marketplace registry pending; webhook wired here when available"
