name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege default for all jobs. GITHUB_TOKEN is read-only unless a job
# overrides this block. Gitleaks runs with GITLEAKS_ENABLE_COMMENTS=false so it
# does not require pull-requests: write.
permissions:
  contents: read

jobs:
  lint:
    name: "Lint (markdown + frontmatter + stale-refs)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install markdownlint-cli2
        run: npm install --no-save --no-audit --no-fund markdownlint-cli2@0.13.0

      - name: Run markdownlint
        run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#.planning" "#.claude" "#test/fixtures/baselines"

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          # .lycheeignore is auto-discovered at repo root. `--exclude 'file://'`
          # skips local-file link resolution (lychee resolves repo-root-relative
          # links as if relative to the source file's dir, which over-fires on
          # our docs that use `[x](connections/foo.md)` from repo root).
          # External HTTP/HTTPS link rot is still caught — that's the valuable check.
          args: >-
            --no-progress
            --accept 200,206,403,429
            --exclude 'file://'
            --exclude-path node_modules
            --exclude-path .planning
            --exclude-path .claude
            --exclude-path test/fixtures/baselines
            --exclude-path test/suite/fixtures
            '**/*.md'
          fail: true

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate agent frontmatter
        run: npm run validate:frontmatter

      - name: Editorial prose lint (em dashes + AI-tells in GDD's own prose + descriptions)
        run: npm run lint:prose

      - name: STYLE.md drift gate (generated from the manifest denylist)
        run: npm run build:style:check

      - name: HARNESSES.md drift gate (generated from harnesses.json)
        run: npm run build:harnesses:check

      - name: Manifest validation (harnesses + skills + prose-denylist schemas)
        run: npm run validate:manifest

      - name: Skill frontmatter drift gate (scripts/skill-templates/*/SKILL.md == manifest/skills.json)
        run: npm run generate:skill-frontmatter:check

      - name: Harness freshness check (tested harnesses warn 60d / fail 180d)
        run: npm run check:harness-freshness

      - name: Domain-index cross-links resolve (7 entry-points)
        run: npm run check:domain-links

      - name: Domain-index no-duplication (entries link, never copy)
        run: npm run check:no-duplication

      - name: Skill composition graph (DAG — no cycles, no dangling refs)
        run: npm run validate:composition-graph

      - name: Catalog integrity (dupes + orphans + bijection + capability honesty)
        run: npm run validate:catalog

      - name: Skill frontmatter boilerplate-cohort lint (no 3+ shared opening sentences)
        run: npm run validate:skill-frontmatter

      - name: Skill graph drift gate (reference/skill-graph.md == skills.json)
        run: npm run build:skill-graph:check

      - name: Detect stale references
        run: node scripts/detect-stale-refs.cjs

      - name: Validate skill-authoring contract
        # Phase 28.5-11 / D-11: validate-skill-length is the load-bearing
        # test contract. Exit 2 = blockers (fail build); exit 1 = warnings
        # only (advisory; emit ::warning::); exit 0 = clean.
        # STRICT_DESCRIPTION stays OFF per D-02 (Phase 33 A/B evidence will
        # graduate strict form). Step output streams the validator summary
        # plus per-skill findings so PR reviewers can see drift at a glance.
        run: |
          set +e
          node scripts/validate-skill-length.cjs --quiet --json > /tmp/validator.json
          EXIT=$?
          set -e
          node -e "const r = JSON.parse(require('fs').readFileSync('/tmp/validator.json','utf8')); console.log('Summary:', JSON.stringify(r.summary)); const bad = r.skills.filter(s => s.errors.length || s.warnings.length); if (bad.length) { console.log('Findings:'); for (const s of bad) { console.log(' ' + s.name + ' (' + s.lines + ' lines):', JSON.stringify({errors: s.errors.map(e=>e.code), warnings: s.warnings.map(w=>w.code)})); } } else { console.log('All skills clean.'); }"
          if [ "$EXIT" = "2" ]; then echo "::error::Skill-authoring contract blockers present (exit 2)"; exit 2; fi
          if [ "$EXIT" = "1" ]; then echo "::warning::Skill-authoring contract warnings present (advisory; exit 1)"; fi
          exit 0

      - name: agentskills.io spec gate (description <=1024 hard cap + body <=500 lines; FAIL rows block)
        # Phase 46 SC#5: the >=1024-char description budget is enforced here as a
        # hard FAIL (R4). WARN rows (advisory >200 chars) do not block.
        run: npm run lint:agentskills

  validate:
    name: "Validate (schemas + plugin + shellcheck)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate JSON schemas
        run: npm run validate:schemas

      - name: Schema types drift gate (committed reference/schemas/generated.d.ts == codegen output)
        run: npm run codegen:schemas:check

      - name: Skill build drift gate (committed skills/ == compile(scripts/skill-templates/))
        run: npm run build:skills:check

      - name: Plugin validate (schema-only fallback)
        run: |
          # D-09: run `claude plugin validate .` if the CLI is on the runner;
          # else the schema validation above is the authoritative check.
          if command -v claude >/dev/null 2>&1 && claude plugin --help 2>&1 | grep -q 'validate'; then
            echo "claude CLI detected — running claude plugin validate ."
            claude plugin validate . || exit 1
          else
            echo "claude plugin validate CLI not available on runner — schema validation (previous step) is the authoritative check per D-09."
          fi

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: error
          scandir: scripts

      - name: Detect hardcoded absolute paths
        run: |
          set -e
          # D-11: flag /Users/, /home/<user>/, and C:\ in shipped content dirs.
          # Exit nonzero on any match.
          # Exclusions (whitelist):
          #   - DEPRECATIONS.md — documents examples
          #   - scripts/lib/pseudonymize.cjs — Phase 30: matches these paths by
          #     design (the module's PURPOSE is to recognize + redact them)
          #   - reference/pseudonymization-rules.md — Phase 30: documents the
          #     same patterns for human review (--show-privacy-diff payload)
          MATCHES=$(grep -rnE '/Users/|/home/[a-z]+/|C:\\\\' \
            scripts/ reference/ agents/ skills/ \
            --include='*.sh' --include='*.cjs' --include='*.js' --include='*.md' \
            --exclude-dir='baselines' \
            2>/dev/null \
            | grep -v 'DEPRECATIONS.md' \
            | grep -v 'scripts/lib/pseudonymize.cjs' \
            | grep -v 'reference/pseudonymization-rules.md' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "Hardcoded absolute paths detected:"
            echo "$MATCHES"
            echo "Use \$HOME or a relative path instead (Phase 1 cross-platform discipline)."
            exit 1
          fi
          echo "No hardcoded absolute paths found."

  test:
    name: "Test (Node ${{ matrix.node-version }} / ${{ matrix.os }})"
    needs: [lint, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test

  security:
    name: "Security (secrets + injection scan)"
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for gitleaks initial scan per D-12

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Injection scanner (CI mode)
        run: npm run scan:injection

      - name: Outbound-network scan (CI mode)
        run: npm run scan:outbound

      - name: WebSocket bind scan (CI mode)
        run: npm run scan:ws-bind

      - name: Install dependencies
        # The scan steps above run standalone node scripts (no install needed),
        # but `npm audit` requires the resolved dependency tree on disk.
        # --no-audit suppresses install-time audit noise; the dedicated audit
        # step below is the real gate. Flags mirror the other jobs in this file.
        run: npm ci --no-audit --no-fund

      - name: npm audit (production deps, HIGH gate)
        # SEC-CI-02: blocking supply-chain gate. --omit=dev scopes the audit to
        # SHIPPED production dependencies only — devDependencies (e.g. the dev-only
        # esbuild HIGH) are not delivered to consumers and intentionally do not gate.
        # --audit-level=high makes npm exit non-zero only on HIGH/CRITICAL advisories.
        # Gate is GREEN today (0 production vulns); it guards against future
        # regressions by turning a silent prod-dep advisory into a hard build failure.
        run: npm audit --omit=dev --audit-level=high

  size-budget:
    name: "Size budget (blocking)"
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Agent size-budget gate
        run: |
          if ! npm run test:size-budget; then
            echo ""
            echo "ERROR: one or more agents exceed their size_budget tier."
            echo "To raise: set size_budget: XL in the agent frontmatter AND include rationale in the PR description."
            echo "See CONTRIBUTING.md for the override process."
            exit 1
          fi

  e2e-headless:
    name: "E2E headless (dry-run + conditional live)"
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: E2E dry-run (zero API cost; always runs)
        run: node --test --experimental-strip-types test/suite/e2e-headless.test.ts

      - name: E2E live (main-branch push + secret only)
        # Plan 21-11: live mode is gated on BOTH the branch refname
        # (refs/heads/main) AND the presence of the Anthropic secret.
        # PR builds from forks never see the secret, so this step is a
        # no-op there; PR coverage relies on the dry-run step above.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDD_E2E_LIVE: '1'
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "# skip e2e-headless live: secret not available on this runner"
            exit 0
          fi
          node --test --experimental-strip-types test/suite/e2e-headless.test.ts
